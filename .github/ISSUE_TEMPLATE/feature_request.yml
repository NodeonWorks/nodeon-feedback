name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **This repository is public.** Don't include customer data, real order numbers, or any sensitive information — describe the problem in general terms.
        > ⚠️ **Questo repository è pubblico.** Non inserire dati di clienti, numeri d'ordine reali o informazioni sensibili.
        
        Got an idea to make Nodeon better? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or limitation you're running into.
      placeholder: I often find myself doing X manually because Nodeon doesn't support...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other tools you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orders
        - Inventory
        - Shipments
        - Billing & Subscriptions
        - Settings
        - Reporting & Analytics
        - Integrations
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, mockups, or examples that might help.
